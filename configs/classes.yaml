# Классы детектора агента готовности (BACKEND.md, раздел 3.2).
# Источник правды для обучения (ml/), Label Studio и GET /meta.
# views — на каких ракурсах класс участвует в агрегации (маска «класс × ракурс», раздел 3.1).
# facade = N / E / S / W.
# Маска применяется при агрегации, а не при разметке: на снимках размечено всё видимое
# (кровля на надирах, building на top_low), иначе детектор учится на противоречивых примерах.

version: classes@ml-v2
views:
  - {id: top_low, label: "Сверху: дом"}
  - {id: top_high, label: "Сверху: участок"}
  - {id: N, label: Север}
  - {id: E, label: Восток}
  - {id: S, label: Юг}
  - {id: W, label: Запад}
top_high_min_relative_altitude_m: 30
# Высота в EXIF считается от точки взлёта, поэтому низкий надир бывает выше 30 м.
# Если в облёте нет top_low, а автоматические надиры различаются по высоте хотя бы в 1,25 раза,
# самый низкий из них становится top_low.
top_low_relative_ratio: 1.25
# Сторона фасада по азимуту камеры ставится автоматически (view_source=exif),
# если ракурс не указан вручную. Снимки дальше допуска от сетки 90° остаются без стороны.
facade_side_tolerance_deg: 25
# Если область объекта на снимке не передана, нужным считается дом в центральной зоне кадра
# (centre_zone — половина её стороны в долях кадра): пилот наводит камеру на объект.
# Рамки этого дома объединяются: перекрывающиеся (merge_overlap) и стоящие друг на друге на
# наклонном кадре — крыша на стенах, стены на фундаменте (stack_overlap — общая доля ширины,
# stack_gap — допустимый зазор в долях высоты меньшей рамки). Область расширяется на margin,
# остальные детекции исключаются как OUTSIDE_TARGET.
# Если дома есть, но ни один не заходит в центральную зону, соседа не подставляем: учитывается
# только центральная зона, облёт получает TARGET_OFF_CENTRE («нужна проверка»).
# Точка облёта (agents/geo.py): медиана GPS надиров, без надиров — куда смотрят боковые камеры.
# Она переносится на каждый кадр по высоте и углам камеры DJI, и нужным считается дом, на который
# попала точка (не дальше max_point_distance в долях кадра). Кадр годится для переноса, если камера
# наклонена вниз не меньше чем на min_tilt_deg и высота от точки взлёта не меньше min_altitude_m.
# Если точка не попала в дом или кадр не годится (съёмка с земли, нет данных камеры), выбор идёт
# по правилу центра (auto_target ниже).
flight_point:
  min_tilt_deg: 30
  min_altitude_m: 3
  max_point_distance: 0.1
auto_target:
  anchor_classes: [foundation, walls_partial, walls_full, roof_frame, roof_covered, building]
  min_conf: 0.5
  centre_zone: 0.1
  merge_overlap: 0.3
  stack_overlap: 0.5
  stack_gap: 0.2
  margin: 0.15

classes:
  - {id: 0,  name: site_prep,        label_ru: "Подготовка участка", color: "#FFA000", views: [facade, top_low, top_high]}
  - {id: 1,  name: foundation,       label_ru: "Фундамент",          color: "#A0522D", views: [facade, top_low, top_high]}
  - {id: 2,  name: walls_partial,    label_ru: "Стены в процессе",   color: "#FF69B4", views: [facade, top_low]}
  - {id: 3,  name: walls_full,       label_ru: "Стены выведены",     color: "#E53935", views: [facade, top_low]}
  - {id: 4,  name: roof_frame,       label_ru: "Стропила",           color: "#00BCD4", views: [facade, top_low]}
  - {id: 5,  name: roof_covered,     label_ru: "Кровля",             color: "#1E40FF", views: [facade, top_low]}
  - {id: 6,  name: opening_empty,    label_ru: "Пустой проём",       color: "#FFEB3B", views: [facade]}
  - {id: 7,  name: window_installed, label_ru: "Окно",               color: "#00C853", views: [facade]}
  - {id: 8,  name: door_installed,   label_ru: "Входная дверь",      color: "#D500F9", views: [facade]}
  - {id: 9,  name: facade_finish,    label_ru: "Отделка фасада",     color: "#B0BEC5", views: [facade]}
  - {id: 10, name: building,         label_ru: "Дом сверху",         color: "#7C4DFF", views: [top_high]}
  - {id: 11, name: paving,           label_ru: "Дорожки и площадки", color: "#757575", views: [top_high]}
  # Забор — признак начала освоения участка: на пустом участке с забором стройка уже началась.
  # Размечается на всех ракурсах, включая временные ограждения стройки; длинный забор — отрезками.
  - {id: 12, name: fence,            label_ru: "Забор",              color: "#FF8A80", views: [facade, top_low, top_high]}
