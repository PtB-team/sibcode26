# Правила стадии и % готовности (BACKEND.md, разделы 3.3–3.5).
# Пороги — начальные настройки, их нужно проверить с ML-командой на размеченных объектах.
version: stages@v1

# Элемент считается найденным, если его итоговая вероятность после noisy-OR не ниже порога.
present_threshold: 0.5
# Ниже этой уверенности стадии облёт уходит на пересъёмку (LOW_CONFIDENCE).
low_confidence: 0.6
# Меньше стольких разных сторон фасада — пересъёмка (FEW_FACADES).
min_facades: 3
# Доля окон, начиная с которой проёмы считаются заполненными (стадия «Готов», шкала банка 100).
done_windows_ratio: 0.9
# GPS снимка дальше этого расстояния от границ участка из кадастра — пересъёмка (OUT_OF_PARCEL).
# Значение — заглушка из раздела 4.4.
parcel_buffer_m: 30

# Техническая проверка снимка (BAD_IMAGE). Резкость — дисперсия лапласиана на снимке, уменьшенном
# до working_size. На 72 снимках dataset минимум 633; при размытии на 5 px исходного кадра — до 190.
# Пересвет и недосвет — доля пикселей ярче 249 или темнее 6; на dataset не выше 0.026.
quality:
  working_size: 1024
  blur_min_laplacian_var: 300
  max_clipped_share: 0.25

# Вклады в % готовности, сумма 100. Частичные этапы (walls_partial, roof_frame) дают половину.
weights:
  site_prep: 5
  foundation: 15
  walls: 30
  roof: 20
  windows: 10
  door: 5
  facade: 10
  done: 10

stages:
  - {id: none, label: Нет работ}
  - {id: foundation, label: Фундамент}
  - {id: walls, label: Стены}
  - {id: roof, label: Кровля}
  - {id: openings, label: Окна и двери}
  - {id: facade, label: Фасад}
  - {id: done, label: Готов}

bank_readiness:
  - {id: 0, label: Ничего нет}
  - {id: 50, label: "Фундамент, стены, возможно каркас крыши"}
  - {id: 100, label: "Стены, крыша, окна и двери"}

reshoot_reasons:
  NO_TOP_LOW: "нет низкого надира: не видно кровлю"
  NO_TOP_HIGH: "нет высокого надира: нельзя проверить участок"
  FEW_FACADES: "меньше 3 фасадов с известной стороной"
  OUT_OF_PARCEL: "снимки сделаны не над участком из кадастра"
  LOW_CONFIDENCE: "низкая уверенность стадии"
  VIEWS_CONFLICT: "ракурсы противоречат друг другу"
  BAD_IMAGE: "снимок размыт, пересвечен или слишком тёмный"
